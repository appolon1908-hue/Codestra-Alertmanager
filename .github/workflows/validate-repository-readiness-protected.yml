name: Validate Alertmanager protected source

on:
  push:
    branches: [development, test, staging, production, main]

permissions:
  contents: read

jobs:
  validate-protected-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Prove and validate exact protected source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r requirements-validation.txt
          python3 scripts/validate_codestra_alertmanager.py
          python3 scripts/validate_repository_readiness.py
          python3 -m unittest discover -s tests -p 'test_*.py'
