name: Release signed Alertmanager configuration bundle

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable human release label (codestra-alertmanager-vX.Y.Z)
        required: true
        type: string
      protected_source_sha:
        description: Exact protected production commit to package
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.protected_source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed on source identity and lineage
        env:
          SOURCE_SHA: ${{ inputs.protected_source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^codestra-alertmanager-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin production
          test "$(git rev-parse origin/production)" = "$SOURCE_SHA"
          python3 scripts/validate_codestra_alertmanager.py
          python3 scripts/validate_repository_readiness.py
      - name: Install checksum-verified release tools
        run: |
          set -Eeuo pipefail
          install_tool() {
            url="$1" expected="$2" binary="$3"
            archive="${RUNNER_TEMP}/$(basename "$url")"
            curl --fail --silent --show-error --location "$url" --output "$archive"
            echo "$expected  $archive" | sha256sum --check -
            tar -xzf "$archive" -C "$RUNNER_TEMP" "$binary"
            install -m 0755 "${RUNNER_TEMP}/${binary}" "${RUNNER_TEMP}/bin/${binary}"
          }
          mkdir -p "${RUNNER_TEMP}/bin"
          install_tool \
            https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz \
            8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3 syft
          install_tool \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a trivy
          install_tool \
            https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz \
            f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454 oras
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Build, inventory and scan exact artifacts
        run: |
          mkdir -p dist/config-root
          python3 scripts/build_config_bundle.py --output dist/alertmanager-config.tar.gz
          tar -xzf dist/alertmanager-config.tar.gz -C dist/config-root
          syft dir:dist/config-root -o spdx-json=dist/alertmanager-config.spdx.json
          trivy fs --exit-code 1 --severity HIGH,CRITICAL --scanners vuln,secret,misconfig dist/config-root
          runtime_image="$(python3 -c 'import json; print(json.load(open("codestra/release/runtime-image.lock.json"))["image"])')"
          trivy image --exit-code 1 --severity HIGH,CRITICAL "$runtime_image"
      - name: Publish immutable OCI configuration artifact
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.protected_source_sha }}
        run: |
          registry="ghcr.io/appolon1908-hue/codestra-alertmanager-config"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          output="$(oras push --format json "${registry}:${RELEASE_TAG}" \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --annotation "org.opencontainers.image.version=${RELEASE_TAG}" \
            dist/alertmanager-config.tar.gz:application/vnd.codestra.alertmanager.config.v1+tar \
            dist/alertmanager-config.spdx.json:application/spdx+json \
            codestra/release/config-bundle.manifest.json:application/vnd.codestra.release.manifest.v1+json)"
          digest="$(jq -r '.digest' <<<"$output")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "identity=${registry}@${digest}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Sign and verify exact OCI digest
        env:
          IDENTITY: ${{ steps.publish.outputs.identity }}
        run: |
          cosign sign --yes "$IDENTITY"
          cosign attest --yes --type spdxjson \
            --predicate dist/alertmanager-config.spdx.json "$IDENTITY"
          workflow_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-config-bundle.yml@refs/heads/production"
          cosign verify "$IDENTITY" \
            --certificate-identity "$workflow_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-attestation "$IDENTITY" --type spdxjson \
            --certificate-identity "$workflow_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/appolon1908-hue/codestra-alertmanager-config
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Record sanitized release evidence
        env:
          IDENTITY: ${{ steps.publish.outputs.identity }}
          SOURCE_SHA: ${{ inputs.protected_source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg artifact "$IDENTITY" \
            --arg runtimeImage "$(python3 -c 'import json; print(json.load(open("codestra/release/runtime-image.lock.json"))["image"])')" \
            --arg configSha256 "$(sha256sum dist/alertmanager-config.tar.gz | cut -d' ' -f1)" \
            --arg sbomSha256 "$(sha256sum dist/alertmanager-config.spdx.json | cut -d' ' -f1)" \
            '{schemaVersion:"1.0.0", repository:$repository, sourceSha:$sourceSha, releaseTag:$releaseTag, runtimeImage:$runtimeImage, configArtifact:$artifact, configSha256:$configSha256, sbomSha256:$sbomSha256, signatureVerified:true, provenanceVerified:true, vulnerabilityGate:"PASS", productionActivated:false}' \
            > dist/release-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: alertmanager-release-evidence-${{ inputs.protected_source_sha }}
          path: |
            dist/alertmanager-config.tar.gz
            dist/alertmanager-config.spdx.json
            dist/release-evidence.json
          if-no-files-found: error
          retention-days: 90
